<!-- Блок «3D-туры» для Tilda (T123 / HTML-код). Вставлять целиком. -->
<style>
.dl3d{--dl-green:#355048;--dl-copper:#BF9273;font-family:'Manrope',Arial,sans-serif;color:#000;background:#fff;padding:50px 0;box-sizing:border-box}
.dl3d *{box-sizing:border-box}
.dl3d__wrap{max-width:1440px;margin:0 auto;padding:0 32px}
.dl3d__title{font-size:40px;line-height:1.1;font-weight:400;margin:0 0 24px;letter-spacing:-.01em}
.dl3d__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.dl3d__card{min-width:0}
.dl3d__media{position:relative;aspect-ratio:4/3;background:#eeebe6 center/cover no-repeat;overflow:hidden;cursor:pointer}
.dl3d__media::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.12);transition:background .3s}
.dl3d__media:hover::after{background:rgba(0,0,0,.25)}
.dl3d__play{position:absolute;left:50%;top:50%;z-index:1;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.dl3d__media:hover .dl3d__play{transform:translate(-50%,-50%) scale(1.08)}
.dl3d__play::before{content:'';margin-left:4px;border-style:solid;border-width:9px 0 9px 14px;border-color:transparent transparent transparent var(--dl-green)}
.dl3d__badge{position:absolute;left:14px;top:14px;z-index:1;font:600 11px/1 'Manrope',Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--dl-green);padding:8px 10px}
.dl3d__media.is-live{cursor:default}
.dl3d__media.is-live::after,.dl3d__media.is-live .dl3d__play,.dl3d__media.is-live .dl3d__badge{display:none}
.dl3d__media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2}
.dl3d__foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:14px}
.dl3d__name{font-size:16px;line-height:1.3;font-weight:500}
.dl3d__name i{font-style:normal;color:var(--dl-copper);margin-right:6px}
.dl3d__name span{display:block;font-size:14px;font-weight:400;color:#6f6f6f;margin-top:2px}
.dl3d__full{font:600 11px/1 'Manrope',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--dl-green);text-decoration:none;white-space:nowrap;border-bottom:1px solid currentColor;padding-bottom:3px;transition:color .25s}
.dl3d__full:hover{color:var(--dl-copper)}
@media (max-width:900px){.dl3d__grid{gap:12px}.dl3d__foot{flex-direction:column;gap:8px}}
@media (max-width:640px){
  .dl3d{padding:36px 0}
  .dl3d__wrap{padding:0 16px}
  .dl3d__title{font-size:28px;margin-bottom:16px}
  .dl3d__grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .dl3d__grid::-webkit-scrollbar{display:none}
  .dl3d__card{flex:0 0 82%;scroll-snap-align:start}
  .dl3d__media{aspect-ratio:4/5}
}
</style>

<section class="dl3d" id="tours">
  <div class="dl3d__wrap">
    <h2 class="dl3d__title">3D-туры по квартирам</h2>
    <div class="dl3d__grid">
      <div class="dl3d__card" data-id="Q1t8f4EBifp">
        <div class="dl3d__media" role="button" tabindex="0" aria-label="Запустить 3D-тур: 2-комнатная квартира 64,79 м²"><span class="dl3d__badge">3D-тур</span><span class="dl3d__play"></span></div>
        <div class="dl3d__foot">
          <div class="dl3d__name"><i>// 01</i>2-комнатная квартира<span>64,79 м²</span></div>
          <a class="dl3d__full" href="https://pro3d.pro/Q1t8f4EBifp/" target="_blank" rel="noopener">На весь экран ↗</a>
        </div>
      </div>
      <div class="dl3d__card" data-id="sXQyyovvFjx">
        <div class="dl3d__media" role="button" tabindex="0" aria-label="Запустить 3D-тур: 2-комнатная квартира 82,28 м²"><span class="dl3d__badge">3D-тур</span><span class="dl3d__play"></span></div>
        <div class="dl3d__foot">
          <div class="dl3d__name"><i>// 02</i>2-комнатная квартира<span>82,28 м²</span></div>
          <a class="dl3d__full" href="https://pro3d.pro/sXQyyovvFjx/" target="_blank" rel="noopener">На весь экран ↗</a>
        </div>
      </div>
      <div class="dl3d__card" data-id="7hWsmfF8jV1">
        <div class="dl3d__media" role="button" tabindex="0" aria-label="Запустить 3D-тур: 3-комнатная квартира 98,76 м²"><span class="dl3d__badge">3D-тур</span><span class="dl3d__play"></span></div>
        <div class="dl3d__foot">
          <div class="dl3d__name"><i>// 03</i>3-комнатная квартира<span>98,76 м²</span></div>
          <a class="dl3d__full" href="https://pro3d.pro/7hWsmfF8jV1/" target="_blank" rel="noopener">На весь экран ↗</a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var root=document.currentScript.previousElementSibling;
  root.querySelectorAll('.dl3d__card').forEach(function(card){
    var id=card.dataset.id, media=card.querySelector('.dl3d__media');
    // Обложка тура с pro3d; сам тур грузится только по клику
    media.style.backgroundImage='url(https://cdn.pro3d.pro/'+id+'/preview.jpg)';
    function start(){
      if(media.classList.contains('is-live'))return;
      media.classList.add('is-live');
      var f=document.createElement('iframe');
      f.src='https://pro3d.pro/'+id+'/?m='+id+'&play=1';
      f.setAttribute('allowfullscreen','');
      f.setAttribute('allow','xr-spatial-tracking; gyroscope; accelerometer; fullscreen');
      f.title=media.getAttribute('aria-label');
      media.appendChild(f);
    }
    media.addEventListener('click',start);
    media.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}});
  });
})();
</script>
