<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Дуалист — 3D-туры (превью)</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>
<!-- Блок «3D-туры» для Tilda (T123 / HTML-код). Вставлять целиком. -->
<style>
.dl3d{--dl-green:#355048;--dl-copper:#BF9273;font-family:var(--t-headline-font,'Manrope'),Arial,sans-serif;color:#000;background:#fff;padding:50px 0;box-sizing:border-box}
.dl3d *{box-sizing:border-box}
.dl3d__wrap{padding:0 40px}
.dl3d__title{font-family:var(--t-headline-font,'Manrope'),Arial,sans-serif;font-size:50px;line-height:1;font-weight:500;color:#000;margin:0 0 40px}
.dl3d__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.dl3d__card{min-width:0}
.dl3d__media{position:relative;aspect-ratio:4/3;background:#eeebe6 center/cover no-repeat;overflow:hidden;cursor:pointer}
.dl3d__media::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.12);transition:background .3s}
.dl3d__media:hover::after{background:rgba(0,0,0,.25)}
.dl3d__play{position:absolute;left:50%;top:50%;z-index:1;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.dl3d__media:hover .dl3d__play{transform:translate(-50%,-50%) scale(1.08)}
.dl3d__play::before{content:'';margin-left:4px;border-style:solid;border-width:9px 0 9px 14px;border-color:transparent transparent transparent var(--dl-green)}
.dl3d__badge{position:absolute;left:14px;top:14px;z-index:1;font-family:var(--t-headline-font,'Manrope'),Arial,sans-serif;font-size:11px;line-height:1;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--dl-green);padding:8px 10px}
.dl3d__foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;padding-top:16px}
.dl3d__name{font-size:30px;line-height:1.15;font-weight:500;color:#000;text-transform:uppercase}
.dl3d__area{font-size:30px;line-height:1.15;font-weight:500;color:var(--dl-copper);white-space:nowrap}
.dl3d-pop{position:fixed;inset:0;z-index:99999;background:rgba(10,14,13,.94);display:none}
.dl3d-pop.is-open{display:block}
.dl3d-pop iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dl3d-pop__close{position:absolute;right:20px;top:20px;z-index:1;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;transition:background .25s}
.dl3d-pop__close:hover{background:#fff}
.dl3d-pop__close::before,.dl3d-pop__close::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:2px;background:#355048;transform:translate(-50%,-50%) rotate(45deg)}
.dl3d-pop__close::after{transform:translate(-50%,-50%) rotate(-45deg)}
.dl3d-lock{overflow:hidden}
@media (max-width:1199px){.dl3d__wrap{padding:0 20px}.dl3d__grid{gap:12px}.dl3d__name,.dl3d__area{font-size:20px}}
@media (max-width:640px){
  .dl3d{padding:36px 0}
  .dl3d__title{font-size:30px;margin-bottom:24px}
  .dl3d__grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -20px;padding:0 20px;scroll-padding:0 20px}
  .dl3d__grid::-webkit-scrollbar{display:none}
  .dl3d__card{flex:0 0 82%;scroll-snap-align:start}
  .dl3d__media{aspect-ratio:4/5}
  .dl3d-pop__close{right:12px;top:12px;width:44px;height:44px}
}
</style>

<section class="dl3d" id="tours">
  <div class="dl3d__wrap">
    <h2 class="dl3d__title">3D-туры по квартирам</h2>
    <div class="dl3d__grid">
      <div class="dl3d__card" data-id="Q1t8f4EBifp">
        <div class="dl3d__media" role="button" tabindex="0" aria-label="Запустить 3D-тур: 2-комнатная квартира 64,79 м²"><span class="dl3d__badge">3D-тур</span><span class="dl3d__play"></span></div>
        <div class="dl3d__foot">
          <div class="dl3d__name">2К квартира</div>
          <div class="dl3d__area">// 64,79 м²</div>
        </div>
      </div>
      <div class="dl3d__card" data-id="sXQyyovvFjx">
        <div class="dl3d__media" role="button" tabindex="0" aria-label="Запустить 3D-тур: 2-комнатная квартира 82,28 м²"><span class="dl3d__badge">3D-тур</span><span class="dl3d__play"></span></div>
        <div class="dl3d__foot">
          <div class="dl3d__name">2К квартира</div>
          <div class="dl3d__area">// 82,28 м²</div>
        </div>
      </div>
      <div class="dl3d__card" data-id="7hWsmfF8jV1">
        <div class="dl3d__media" role="button" tabindex="0" aria-label="Запустить 3D-тур: 3-комнатная квартира 98,76 м²"><span class="dl3d__badge">3D-тур</span><span class="dl3d__play"></span></div>
        <div class="dl3d__foot">
          <div class="dl3d__name">3К квартира</div>
          <div class="dl3d__area">// 98,76 м²</div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var root=document.currentScript.previousElementSibling;
  // Попап на весь экран, один на блок
  var pop=document.createElement('div');
  pop.className='dl3d-pop';
  pop.setAttribute('role','dialog');
  pop.setAttribute('aria-modal','true');
  pop.innerHTML='<button class="dl3d-pop__close" type="button" aria-label="Закрыть тур"></button>';
  document.body.appendChild(pop);
  var closeBtn=pop.querySelector('.dl3d-pop__close'), last=null;
  function open(id,title,from){
    var f=document.createElement('iframe');
    f.src='https://pro3d.pro/'+id+'/?m='+id+'&play=1';
    f.setAttribute('allowfullscreen','');
    f.setAttribute('allow','xr-spatial-tracking; gyroscope; accelerometer; fullscreen');
    f.title=title;
    pop.appendChild(f);
    pop.classList.add('is-open');
    document.documentElement.classList.add('dl3d-lock');
    last=from; closeBtn.focus();
  }
  function close(){
    if(!pop.classList.contains('is-open'))return;
    var f=pop.querySelector('iframe'); if(f)f.remove();
    pop.classList.remove('is-open');
    document.documentElement.classList.remove('dl3d-lock');
    if(last)last.focus();
  }
  closeBtn.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  root.querySelectorAll('.dl3d__card').forEach(function(card){
    var id=card.dataset.id, media=card.querySelector('.dl3d__media');
    // Обложка тура с pro3d; сам тур грузится только по клику
    media.style.backgroundImage='url(https://cdn.pro3d.pro/'+id+'/preview.jpg)';
    function start(){open(id,media.getAttribute('aria-label'),media)}
    media.addEventListener('click',start);
    media.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}});
  });
})();
</script>
</body></html>
